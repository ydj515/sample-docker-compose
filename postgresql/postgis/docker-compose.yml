name: pg-postgis-lab

x-environment: &environment
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  TZ: ${TZ:-Asia/Seoul}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-lab}

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 5s
  timeout: 5s
  retries: 20

services:
  postgis:
    image: ${POSTGRES_IMAGE:-postgis/postgis:17-3.6-alpine@sha256:a8ffa9afeea4ad6eada171fa2afdb57cd3eb90f92ce20156aa2cb8411d70e0cd}
    # 공식 이미지의 amd64 지원 기준. ARM에서는 에뮬레이션 필요.
    platform: linux/amd64
    env_file:
      - .env
    environment: *environment
    ports: ["127.0.0.1:${POSTGRES_PORT:-5541}:5432"]
    volumes: ["postgis-data:/var/lib/postgresql/data", "./initdb.d/99-enable-extension.sql:/docker-entrypoint-initdb.d/99-enable-extension.sql:ro"]
    healthcheck: *healthcheck

volumes:
  postgis-data:
