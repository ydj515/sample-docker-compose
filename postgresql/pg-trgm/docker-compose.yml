name: pg-pg-trgm-lab

x-environment: &environment
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  TZ: ${TZ:-Asia/Seoul}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-lab}

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 5s
  timeout: 5s
  retries: 20

services:
  ops:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24}
    env_file:
      - .env
    environment: *environment
    ports: ["127.0.0.1:${POSTGRES_PORT:-5549}:5432"]
    volumes: ["ops-data:/var/lib/postgresql/data", "./initdb.d/99-enable-extension.sql:/docker-entrypoint-initdb.d/99-enable-extension.sql:ro"]
    healthcheck: *healthcheck

volumes:
  ops-data:
