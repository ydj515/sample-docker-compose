name: pg-pgvector-lab

x-environment: &environment
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  TZ: ${TZ:-Asia/Seoul}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-lab}

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 5s
  timeout: 5s
  retries: 20

services:
  vector:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    env_file:
      - .env
    environment: *environment
    ports: ["127.0.0.1:${POSTGRES_PORT:-5542}:5432"]
    volumes: ["vector-data:/var/lib/postgresql/data", "./initdb.d/99-enable-extension.sql:/docker-entrypoint-initdb.d/99-enable-extension.sql:ro"]
    healthcheck: *healthcheck

volumes:
  vector-data:
