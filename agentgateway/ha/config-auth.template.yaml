# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite:///data/data.db

gateways:
  default:
    port: 4000

ui:
  gateways: default

mcp:
  port: 3000
  statefulMode: stateless
  dnsRebindingProtection: true
  policies:
    apiKey:
      mode: strict
      keys:
        - keyHash: "@BASELINE_HASH@"
          metadata:
            user: baseline
            role: viewer
        - keyHash: "@DENIED_HASH@"
          metadata:
            user: denied
            role: viewer
        - keyHash: "@INVALID_HASH@"
          metadata:
            user: invalid
            role: viewer
        - keyHash: "@CALCULATOR_HASH@"
          metadata:
            user: calculator
            role: calculator
    localRateLimit:
      - maxTokens: 20
        tokensPerFill: 20
        fillInterval: 60s
        type: requests
        key: apiKey.user
    mcpAuthorization:
      rules:
        - 'mcp.tool.name == "echo"'
        - 'mcp.tool.name == "add" && apiKey.role == "calculator"'
    cors:
      allowOrigins:
        - http://localhost:14001
        - http://localhost:14002
        - http://127.0.0.1:14001
        - http://127.0.0.1:14002
      allowHeaders:
        - content-type
        - mcp-protocol-version
        - mcp-session-id
        - cache-control
        - authorization
      exposeHeaders:
        - Mcp-Session-Id
  targets:
    - name: demo
      mcp:
        host: http://mcp-demo:3005/mcp
