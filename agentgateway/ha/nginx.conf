worker_processes 1;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateways {
        zone gateways 64k;
        server gateway-1:3000 resolve max_fails=1 fail_timeout=5s;
        server gateway-2:3000 resolve max_fails=1 fail_timeout=5s;
    }
    server {
        listen 3000;
        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }
        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            # Do not replay POST requests already sent to a backend.
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
}
