worker_processes 1;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateways {
        zone gateways 64k;
        server gateway-1:3000 resolve max_fails=1 fail_timeout=5s;
        server gateway-2:3000 resolve max_fails=1 fail_timeout=5s;
    }
    upstream secure_gateways {
        zone secure_gateways 64k;
        server gateway-1:3443 resolve max_fails=1 fail_timeout=5s;
        server gateway-2:3443 resolve max_fails=1 fail_timeout=5s;
    }
    server {
        listen 3443 ssl;
        ssl_certificate /certs/gateway/tls.crt;
        ssl_certificate_key /certs/gateway/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass https://secure_gateways;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name gateway-tls;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
    server {
        listen 3000;
        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }
        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            # Do not replay POST requests already sent to a backend.
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
}
